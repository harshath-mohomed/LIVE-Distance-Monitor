<!DOCTYPE html>
<html>

<head>
  <title> LIVE Distance Monitor Dashboard</title>

  <style>

    body {
      font-family: Arial;
      text-align: center;
      margin-top: 50px;
      background: #111;
      color: white;
    }

    .card {

      width: 300px;
      margin: auto;
      padding: 20px;

      border-radius: 20px;

      background: #222;

      box-shadow:
      0px 0px 20px rgba(0,0,0,0.5);
    }

    h1 {
      color: cyan;
    }

    #distance {
      font-size: 50px;
      color: lime;
    }

  </style>
</head>

<body>

<div class="card">

<h1>Distance Monitor [LIVE]</h1>

<div id="distance">
-- cm
</div>

</div>

<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<script>

const socket =
  io("http://localhost:3000");

socket.on(
  "distance_update",
  (data) => {

    document.getElementById(
      "distance"
    ).innerHTML =
      data.distance_cm.toFixed(2)
      + " cm";

    console.log(data);
});

</script>

</body>
</html>
